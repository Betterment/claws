name: Gem Release

# Sometimes a release workflow can break due to external dependencies.
# These can be tedious to remediate, so setting up `workflow_dispatch`
# means we can manually test the process without having to make back
# to back no-op releases.
#
# ignore: RiskyTriggers
on:
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release'
        required: false
        default: false
        type: boolean
  
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Set up Ruby 3.X
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '3.4.10'
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake

  publish:
    needs: build
    if: needs.build.result == 'success' && (github.event_name == 'push' || inputs.force_release)
    runs-on: ubuntu-latest
    name: Publish
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Check for an existing release
      id: version
      run: |
        VERSION=$(ruby -e 'print Gem::Specification.load("claws-scan.gemspec").version')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if gh release view "v$VERSION" > /dev/null 2>&1
        then
          echo "release_exists=true" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE_RELEASE" != "true" ]]
          then
            echo "v$VERSION is already released; skipping publish."
          fi
        else
          echo "release_exists=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        GH_TOKEN: "${{ github.token }}"
        FORCE_RELEASE: "${{ inputs.force_release }}"
    - name: Publish to RubyGems
      if: steps.version.outputs.release_exists == 'false' || inputs.force_release
      run: |
        gem build claws-scan.gemspec --output release.gem

        mkdir -p "$HOME/.gem"
        touch "$HOME/.gem/credentials"
        chmod 0600 "$HOME/.gem/credentials"
        printf -- "---\n:rubygems_api_key: %s\n" "$GEM_HOST_API_KEY" > "$HOME/.gem/credentials"
        if [[ "$FORCE_RELEASE" == "true" ]]
        then
          gem push release.gem || exit 0
        # Tolerate a gem that was pushed by an earlier run whose release step
        # failed, so re-running the job can finish creating the release.
        elif ! output=$(gem push release.gem 2>&1)
        then
          echo "$output"
          grep -q "Repushing of gem versions is not allowed" <<< "$output" || exit 1
        else
          echo "$output"
        fi
      env:
        GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_AUTH_TOKEN}}"
        FORCE_RELEASE: "${{ github.event.inputs.force_release }}"
    - name: Create GitHub release
      if: steps.version.outputs.release_exists == 'false'
      run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
      env:
        GH_TOKEN: "${{ github.token }}"
        VERSION: "${{ steps.version.outputs.version }}"
